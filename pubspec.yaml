name: notes
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/icon.jpg"
  windows:
    generate: true
    image_path: "assets/icon/icon.jpg"
    icon_size: 256
